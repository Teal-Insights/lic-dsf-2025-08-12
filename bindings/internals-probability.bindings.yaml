      concept: OBS_VALUE
      dtype: float
      bind:
        kind: data_cell
        read: float
    dimensions:
    - id: INDICATOR
      concept: INDICATOR
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: A
        read: string
        normalize: strip
    - id: TIME_PERIOD
      concept: TIME_PERIOD
      role: key
      scope: cell
      bind:
        kind: column_header
        header_row: 76
        read: int
  key:
  - INDICATOR
