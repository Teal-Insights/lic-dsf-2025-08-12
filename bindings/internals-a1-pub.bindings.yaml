schema_version: 1.21.0
workbook: workbook.xlsm
concept_scheme:
  id: lic_dsf_2025_08_12
  concepts:
  - id: OBS_VALUE
    name: Observation value
    dtype: number
  - id: TIME_PERIOD
    name: Time period
    dtype: int
  - id: INDICATOR
    name: Indicator
    dtype: string
  - id: PARAMETER
    name: Parameter
    dtype: string
  - id: TABLE
    name: Table
    dtype: string
  - id: REF_AREA
    name: Reference area
    dtype: string
    sdmx_concept: REF_AREA
  - id: SCENARIO
    name: Scenario
    dtype: string
  - id: INSTRUMENT
    name: Financing instrument
    dtype: string
  - id: COMMODITY
    name: Commodity
    dtype: string
  - id: VARIANT
    name: Variant
    dtype: string
  - id: DSA_SECTION
    name: DSA statement section
    dtype: string
series:
- id: a1_hist_pub_historical_statistics
  sheet: A1_Historical_pub
  data_range: A1_Historical_pub!F62:H67
  layout: matrix
  internal: {}
  exclude_columns:
  - G
  structure:
    measure:
      concept: OBS_VALUE
      dtype: float
      bind:
        kind: data_cell
        read: float
    dimensions:
    - id: INDICATOR
      concept: INDICATOR
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: B
        read: string
        normalize: strip
    - id: VARIANT
      concept: VARIANT
      role: key
      scope: cell
      bind:
        kind: value_map
        values:
          Historical average: F
          Standard deviation: H
  key:
  - INDICATOR
  - VARIANT
  series_context:
    TABLE: a1_historical_pub.dsa
    DSA_SECTION: historical_statistics
  notes: Historical average and standard deviation of key variables (past 10 years).
