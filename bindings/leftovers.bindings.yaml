schema_version: 1.19.0
workbook: workbook.xlsm
concept_scheme:
  id: lic_dsf_2025_08_12
  concepts:
  - id: OBS_VALUE
    name: Observation value
    dtype: number
  - id: TIME_PERIOD
    name: Time period
    dtype: int
  - id: INDICATOR
    name: Indicator
    dtype: string
  - id: PARAMETER
    name: Parameter
    dtype: string
  - id: TABLE
    name: Table
    dtype: string
