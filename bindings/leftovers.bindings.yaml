    name: Financing instrument
    dtype: string
  - id: COMMODITY
    name: Commodity
    dtype: string
  - id: VARIANT
    name: Variant
    dtype: string
  - id: DSA_SECTION
    name: DSA statement section
    dtype: string
  - id: HOLDER
    name: Debt holder residency
    dtype: string
  - id: ISSUANCE_YEAR
    name: Issuance year
    dtype: int
series:
- id: leftover_exchange_rate_pa
  sheet:
  - B2_PB_mkt_pub
  - B2_PB_non_mkt_pub
  - Baseline - public
  - C1_Combined CL
  - C2_Natural disaster
  data_range:
  - B2_PB_mkt_pub!E110:Y110
  - B2_PB_non_mkt_pub!E110:Y110
  - '''Baseline - public''!O114:AI114'
  - '''C1_Combined CL''!E110:Y110'
  - '''C2_Natural disaster''!E111:Y111'
  layout: series
  structure:
    measure:
      concept: OBS_VALUE
      dtype: float
      bind:
        kind: data_cell
        read: float
    dimensions:
    - id: SCENARIO
      concept: SCENARIO
      role: key
      scope: cell
      bind:
        kind: sheet_name
        values:
          B2_PB_mkt_pub: B2_mkt
          B2_PB_non_mkt_pub: B2_nonmkt
          Baseline - public: Baseline
          C1_Combined CL: C1
          C2_Natural disaster: C2
    - id: TIME_PERIOD
      concept: TIME_PERIOD
      role: key
      scope: cell
      bind:
        kind: column_header
        header_row: 7
        read: int
  key:
  - SCENARIO
  - TIME_PERIOD
  series_context:
    TABLE: leftover.scenario
    PARAMETER: exchange_rate_pa
  notes: exchange_rate_pa leftover on DSA scenario sheets, keyed by SCENARIO.
  internal: {}
