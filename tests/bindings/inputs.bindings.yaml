- id: input6_standard_user_defined_threshold
  sheet: Input 6(optional)-Standard Test
  data_range:
  - '''Input 6(optional)-Standard Test''!D18'
  - '''Input 6(optional)-Standard Test''!D22'
  - '''Input 6(optional)-Standard Test''!H22'
  - '''Input 6(optional)-Standard Test''!D26'
  - '''Input 6(optional)-Standard Test''!D30'
  - '''Input 6(optional)-Standard Test''!D33'
  - '''Input 6(optional)-Standard Test''!D42'
  - '''Input 6(optional)-Standard Test''!D45'
  - '''Input 6(optional)-Standard Test''!D48'
  - '''Input 6(optional)-Standard Test''!D51'
  - '''Input 6(optional)-Standard Test''!D54'
  layout: series
  input:
    domain:
      enum:
      - Historical average only
      - Baseline projection only
      - Whichever is lower
  structure:
    measure:
      concept: OBS_VALUE
      dtype: string
      bind:
        kind: data_cell
        read: string
    dimensions:
    - id: SCENARIO
      concept: SCENARIO
      role: key
      scope: cell
      bind:
        kind: value_map
        values:
          B1. Real GDP growth: 18
          B2. Primary balance: 22
          B3. Exports: 26
          B4. Other (non-debt creating) flows:
          - 30
          - 33
          B6. Combination:
          - 42
          - 45
          - 48
          - 51
          - 54
        read: string
    - id: INDICATOR
      concept: INDICATOR
      role: key
      scope: cell
      bind:
        kind: value_map
        values:
          'Size of real GDP growth shock, # of standard deviations':
          - 18
          - 42
          'Size of PB/GDP shock, # of standard deviations':
          - 22
          - 48
          'Size of exports growth shock, # of standard deviations':
          - 26
          - 45
          'Other flows (current transfers) shock, # of standard deviations':
          - 30
          - 51
          'Other flows (FDI) shock, # of standard deviations':
          - 33
          - 54
        read: string
    - id: PARAMETER
      concept: PARAMETER
      role: key
      scope: cell
      bind:
        kind: value_map
        values:
          Size: D
          Interactions: H
        read: string
  key:
  - SCENARIO
  - INDICATOR
  - PARAMETER
  series_context:
    TABLE: input_6.standard_test
    VARIANT: User defined
  notes: User-defined threshold rules on the standard stress-test Size and Interactions
    dropdowns, keyed by scenario, shock, and Size vs Interactions.
