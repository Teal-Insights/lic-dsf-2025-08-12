- id: customized_public_delta
  sheet: Customized Scenario - public
  data_range:
  - '''Customized Scenario - public''!E11:Y11'
  - '''Customized Scenario - public''!E13:Y13'
  - '''Customized Scenario - public''!E15:Y15'
  - '''Customized Scenario - public''!E17:Y17'
  - '''Customized Scenario - public''!E20:Y20'
  - '''Customized Scenario - public''!E22:Y22'
  - '''Customized Scenario - public''!E24:Y24'
  - '''Customized Scenario - public''!E28:Y28'
  - '''Customized Scenario - public''!E38:Y38'
  layout: series
  input: {}
  domain:
    real_between:
      min: 0
      max: 1.0e+15
  structure:
    measure:
      concept: OBS_VALUE
      dtype: float
      bind:
        kind: data_cell
        read: float
    dimensions:
    - id: INDICATOR
      concept: INDICATOR
      role: key
      scope: cell
      bind:
        kind: value_map
        values:
          Revenue and grants: 11
          Primary (noninterest) expenditure: 13
          Grants: 15
          Public Sector Assets (e.g. Deposits): 17
          Real GDP growth (in percent): 20
          Inflation rate (GDP deflator, in percent): 22
          Nominal depreciation of local currency (percentage change in LC per dollar): 24
          Exports: 28
          GDP deflator in US dollar terms (change in percent): 38
        read: string
    - id: TIME_PERIOD
      concept: TIME_PERIOD
      role: key
      scope: cell
      bind:
        kind: column_header
        header_row: 7
        read: int
  key:
  - INDICATOR
  - TIME_PERIOD
  series_context:
    TABLE: customized_public.a2_path
    VARIANT: Delta
  notes: A2 customized-scenario deltas on the public and external-debt path variables,
    keyed by indicator.
