schema_version: 1.21.0
workbook: workbook.xlsm
concept_scheme:
  id: lic_dsf_2025_08_12
  concepts:
  - id: OBS_VALUE
    name: Observation value
    dtype: number
  - id: TIME_PERIOD
    name: Time period
    dtype: int
  - id: PARAMETER
    name: Parameter
    dtype: string
  - id: TABLE
    name: Table
    dtype: string
  - id: REF_AREA
    name: Reference area
    dtype: string
    sdmx_concept: REF_AREA
  - id: SCENARIO
    name: Scenario
    dtype: string
  - id: INSTRUMENT
    name: Financing instrument
    dtype: string
  - id: COMMODITY
    name: Commodity
    dtype: string
  - id: VARIANT
    name: Variant
    dtype: string
  - id: INDICATOR
    name: Indicator
    dtype: string
  - id: HOLDER
    name: Debt holder residency
    dtype: string
  - id: ISSUANCE_YEAR
    name: Issuance year
    dtype: int
  - id: LANGUAGE
    name: Language
    dtype: string
  - id: DSA_SECTION
    name: DSA statement section
    dtype: string
series:
- id: com_as_of_date
  sheet: COM
  data_range: COM!A4:A8
  layout: series
  constant: {}
  validation:
    intersect_graph_leaves: false
  structure:
    measure:
      concept: OBS_VALUE
      dtype: int
      bind:
        kind: data_cell
        read: int
    dimensions:
    - id: COMMODITY
      concept: COMMODITY
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: C
        read: string
        normalize: strip
  key:
  - COMMODITY
  series_context:
    TABLE: com.prices
    INDICATOR: As-of date
  notes: Price-table as-of date (Excel serial) for each commodity on COM.
- id: com_prices
  sheet: COM
  data_range: COM!D4:F8
  layout: matrix
  constant: {}
  structure:
    measure:
      concept: OBS_VALUE
      dtype: float
      bind:
        kind: data_cell
        read: float
    dimensions:
    - id: COMMODITY
      concept: COMMODITY
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: C
        read: string
        normalize: strip
    - id: INDICATOR
      concept: INDICATOR
      role: key
      scope: cell
      bind:
        kind: column_header
        header_row: 3
        read: string
        normalize: strip
  key:
  - COMMODITY
  - INDICATOR
  series_context:
    TABLE: com.prices
  notes: 'COM commodity price grid: latest actual and percentile forecasts.'
- id: com_price_percent_change
  sheet: COM
  data_range: COM!G4:G8
  layout: series
  constant: {}
  validation:
    intersect_graph_leaves: false
  structure:
    measure:
      concept: OBS_VALUE
