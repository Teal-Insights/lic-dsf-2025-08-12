    - id: TIME_PERIOD
      concept: TIME_PERIOD
      role: key
      scope: cell
      bind:
        kind: column_header
        header_row: 1
        read: int
  key:
  - TIME_PERIOD
  series_context:
    TABLE: cpia.database
    INDICATOR: 'CPIA'
  notes: 'CPIA score by year.'
