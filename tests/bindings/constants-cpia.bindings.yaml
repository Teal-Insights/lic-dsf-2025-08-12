- id: cpia_record_fields
  sheet: 'CPIA'
  data_range: CPIA!A2:H2
  layout: series
  constant: {}
  structure:
    measure:
      concept: OBS_VALUE
      dtype: string
      bind:
        kind: data_cell
        read: string
    dimensions:
    - id: INDICATOR
      concept: INDICATOR
      role: key
      scope: cell
      bind:
        kind: column_header
