- id: realism1_external_current_vintage_projection
  sheet: Realism 1 - Forecast Error
  data_range: '''Realism 1 - Forecast Error''!H15:Y30'
  layout: matrix
  internal: {}
  structure:
    measure:
      concept: OBS_VALUE
      dtype: float
      bind:
        kind: data_cell
        read: float
    dimensions:
    - id: INDICATOR
      concept: INDICATOR
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: E
        read: string
        normalize: strip
    - id: TIME_PERIOD
      concept: TIME_PERIOD
      role: key
      scope: cell
      bind:
        kind: column_header
        header_row: 11
        read: int
  key:
  - INDICATOR
  - TIME_PERIOD
  series_context:
    TABLE: realism1.external_debt
  notes: Current-vintage external debt projection by WEO indicator and year. Row labels are the descriptions
    in column E; years are the header on row 11.
